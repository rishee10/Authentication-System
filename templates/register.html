<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <style>
        body { font-family: Arial; background-color: #f8f9fa; text-align: center; }
        form { margin-top: 100px; background: white; display: inline-block; padding: 30px; border-radius: 10px; }
        input { margin: 10px; padding: 10px; width: 200px; }
        button { padding: 10px 20px; background: #007BFF; border: none; color: white; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>Register</h2>
    <form method="POST">
        <input type="text" name="username" placeholder="Username" required /><br>
        <input type="password" name="password" placeholder="Password" required /><br>
        <button type="submit">Register</button>
    </form>
    <p><a href="/login">Already have an account? Login</a></p>
</body>
</html>
